name: Scheduled checks

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm outdated || true
      - run: npm audit --omit=dev || true
