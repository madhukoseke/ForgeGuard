name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          FORGEGUARD_STORE: memory

      - name: Build MCP server
        run: npm run build:mcp

      - name: Pack check
        run: npm run pack:check

      - name: Production audit
        run: npm audit --omit=dev

      - name: Check for committed secrets
        run: |
          if git ls-files '.env' '.env.local' '.env.*.local' | grep -q .; then
            echo 'ERROR: env files must not be committed'
            git ls-files '.env' '.env.local' '.env.*.local'
            exit 1
          fi

  pack-smoke:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tarball install smoke
        run: bash scripts/pack-install-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard E2E
        run: npm run e2e

      - name: Cinematic demo E2E
        run: npm run demo:e2e

      - name: Replicas webhook E2E
        run: npm run e2e:replicas
