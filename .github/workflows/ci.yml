name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          FORGEGUARD_STORE: memory

      - name: Check for committed secrets
        run: |
          if git ls-files '.env' '.env.local' '.env.*.local' | grep -q .; then
            echo 'ERROR: env files must not be committed'
            git ls-files '.env' '.env.local' '.env.*.local'
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard E2E
        run: npm run e2e

      - name: Cinematic demo E2E
        run: npm run demo:e2e
