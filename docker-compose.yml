services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forgeguard
      POSTGRES_PASSWORD: forgeguard
      POSTGRES_DB: forgeguard
    ports:
      - "5432:5432"
    volumes:
      - fg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeguard -d forgeguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://forgeguard:forgeguard@postgres:5432/forgeguard
      FORGEGUARD_STORE: postgres
      FORGEGUARD_BACKEND: postgres
      FORGEGUARD_OPERATOR_TOKEN: ${FORGEGUARD_OPERATOR_TOKEN:-change-me-in-production}
      # Optional production gate: FORGEGUARD_STRICT_CONFIG=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health?minimal=1').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  fg_pg_data:
